<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  @page { size: 105mm 148mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 105mm; height: 148mm; }
  body { font-family: 'Source Sans 3', Arial, sans-serif; background: #fff; color: #0a1a33; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { width: 105mm; height: 148mm; display: flex; flex-direction: column; }
  .top { background: #0a1a33; color: #fff; padding: 11mm 9mm 8mm; position: relative; }
  .top::after { content: ''; position: absolute; left: 9mm; bottom: 0; width: 18mm; height: 1.2mm; background: #c8a55a; }
  .mark { display: inline-grid; place-items: center; width: 9mm; height: 9mm; border: 0.4mm solid #c8a55a; border-radius: 1.6mm; color: #c8a55a; font: 800 3.2mm 'Archivo', sans-serif; margin-bottom: 5mm; }
  h1 { font: 800 9.5mm/1 'Archivo', sans-serif; margin: 0 0 3mm; letter-spacing: -0.2mm; }
  .titles { font-size: 3.4mm; font-weight: 600; color: #d8e1ee; }
  .titles span { color: #c8a55a; margin: 0 1.6mm; }
  .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6mm 9mm 8mm; text-align: center; }
  .scan { font: 600 4.2mm 'Archivo', sans-serif; margin: 0 0 4mm; color: #0a1a33; }
  .qr { width: 56mm; height: 56mm; }
  .qr img { width: 100%; height: 100%; display: block; }
  .url { margin-top: 4mm; font: 500 2.9mm 'IBM Plex Mono', monospace; color: #4b5a70; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="mark">AA</div>
      <h1>Ahmed Ali</h1>
      <div class="titles">Civil Engineer<span>|</span>Planning Engineer<span>|</span>Cost Control</div>
    </div>
    <div class="body">
      <p class="scan">Scan to View My Portfolio</p>
      <div class="qr"><img src="../public/qr/portfolio-qr.svg" alt="Website QR Code"></div>
      <div class="url">ahmadali205.github.io/Eng_Ahmed</div>
    </div>
  </div>
</body>
</html>
